name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (pinned environment from requirements-lock.txt)
        run: |
          grep -v -E '^(colorama|pywin32)' requirements-lock.txt > /tmp/lock.txt
          pip install -r /tmp/lock.txt ruff
          pip install -e . --no-deps
      - name: Lint (project code only; the vendored EMHASS code is not ours to lint)
        run: ruff check src/avishkar_ems app scripts examples tests/avishkar_ems --no-fix
      - name: Project tests
        run: python -m pytest tests/avishkar_ems -q -p no:cacheprovider
      - name: README matches results/
        run: python scripts/update_readme.py --check

  platform:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: avishkar
          POSTGRES_PASSWORD: ci_only_not_a_secret
          POSTGRES_DB: avishkar_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U avishkar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://avishkar:ci_only_not_a_secret@localhost:5432/avishkar_test?schema=public
      DATABASE_URL_TEST: postgresql://avishkar:ci_only_not_a_secret@localhost:5432/avishkar_test?schema=public
      SESSION_SECRET: ci-session-secret-0123456789abcdef-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: platform/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: platform/pnpm-lock.yaml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Python engine dependencies (the integration tests start the real engine)
        run: |
          grep -v -E '^(colorama|pywin32)' requirements-lock.txt > /tmp/lock.txt
          pip install -r /tmp/lock.txt -r platform/engine/requirements.txt
      - name: Install
        working-directory: platform
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        working-directory: platform
        run: pnpm -C api typecheck
      - name: Lint
        working-directory: platform
        run: pnpm -C api lint
      - name: Tests (unit + integration against real PostGIS and the real engine)
        working-directory: platform
        env:
          # fail rather than skip if the engine cannot be started
          REQUIRE_ENGINE: "1"
        run: pnpm -C api test
      - name: Build
        working-directory: platform
        run: pnpm -C api build

  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install (pinned environment from requirements-lock.txt, plus the web framework)
        run: |
          grep -v -E '^(colorama|pywin32)' requirements-lock.txt > /tmp/lock.txt
          pip install -r /tmp/lock.txt -r platform/engine/requirements.txt ruff
      - name: Lint
        run: ruff check platform/engine --no-fix
      - name: Engine tests (optimiser, validator, HTTP layer, committed OpenAPI)
        working-directory: platform/engine
        run: python -m pytest tests -q

  web:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: platform/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: platform/pnpm-lock.yaml
      - name: Install
        working-directory: platform
        run: pnpm install --frozen-lockfile
      - name: API types match the committed OpenAPI document
        working-directory: platform
        run: |
          pnpm -C web gen:api
          git diff --exit-code -- web/src/lib/api-types.ts
      - name: Typecheck
        working-directory: platform
        run: pnpm -C web typecheck
      - name: Lint
        working-directory: platform
        run: pnpm -C web lint
      - name: Tests
        working-directory: platform
        run: pnpm -C web test
      - name: Build
        working-directory: platform
        run: pnpm -C web build
