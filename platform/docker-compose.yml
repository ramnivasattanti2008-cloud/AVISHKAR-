# BUILT AND RUN on 2026-10-30: `docker compose up -d` brings all four services up healthy, and the documented sequence
# below was followed: migrate, seed, open the web app. Verified against the running stack: `pnpm -C platform/web journey`
# 41/41 over HTTP, `pnpm -C platform/web browser` 21/21 in Chromium, `pnpm -C platform/web smoke` 12/12.
# Two defects were found by doing it, and both are fixed: `db:seed` could not find the tariff and policy files (they live
# at the repository root, outside the build context -- see SEED_DATA_DIR and the volume on the api service below), and the
# map was blank in every container because this file passes NEXT_PUBLIC_OSM_TILE_URL as an empty string when the operator
# has not chosen a tile service, which `web/src/lib/basemaps.ts` used to take as the tile URL.
# The sandbox this ran in intercepts TLS, so the builds needed `--network=host` and a temporary CA layer; that shim is not
# committed and is not needed where outbound TLS is not intercepted.
#
#   export POSTGRES_PASSWORD=...  ENGINE_API_KEY=...  SESSION_SECRET=...  PROVIDER_USER_AGENT="AVISHKAR (you@example.com)"
#   docker compose up --build -d
#   docker compose run --rm api pnpm db:migrate        # applies the committed migrations; never resets anything
#   docker compose run --rm api pnpm db:seed           # the sourced tariffs and policy rules
#   open http://localhost:3000
#   docker compose run --rm api pnpm db:make-admin you@example.com   # after registering, to get the Admin page
#
# Only the web app is published. The API, the engine and the database stay on the private network; the browser reaches the API only
# through the web app's /api proxy, so the session cookie is first-party. Put TLS in front of the web app before real use: the
# cookie is `Secure` in production, which browsers only honour over https (or on localhost).
name: avishkar

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: avishkar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: avishkar
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avishkar -d avishkar"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  engine:
    build:
      context: .
      dockerfile: docker/engine.Dockerfile
    environment:
      ENGINE_API_KEY: ${ENGINE_API_KEY:?set ENGINE_API_KEY, 16 characters or more}
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "8080"
      DATABASE_URL: postgresql://avishkar:${POSTGRES_PASSWORD}@db:5432/avishkar
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET, 32 characters or more}
      ENGINE_URL: http://engine:8090
      ENGINE_API_KEY: ${ENGINE_API_KEY}
      # the web app is the only thing that reaches the API, and it forwards the visitor's address
      TRUST_PROXY: "1"
      PROVIDER_USER_AGENT: ${PROVIDER_USER_AGENT:?set PROVIDER_USER_AGENT to something that identifies the service with a real contact}
      # run the background jobs in exactly one API process
      JOBS_ENABLED: "true"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Where `pnpm db:seed` reads the sourced tariff orders and policy rules from. They live at the repository
      # root, which is outside this build context (the context is `platform/`), so they are not in the image and
      # the seeder's default path resolves to a `/data` that does not exist. Without this, `db:seed` fails with
      # ENOENT and a deployed instance has no tariff plans and no policy rules at all -- which was exactly what
      # happened the first time these images were built and run, on 2026-10-30.
      SEED_DATA_DIR: /seed-data
    volumes:
      # Read-only, and read only at seed time. Mounted rather than copied into the image on purpose: these files
      # are the single source for both the Python EMS and the platform (see the repository's CLAUDE.md), and
      # duplicating them into an image is how the two would drift apart.
      - ../data:/seed-data:ro
    depends_on:
      db:
        condition: service_healthy
      engine:
        condition: service_started
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        API_URL: http://api:8080
        NEXT_PUBLIC_OSM_TILE_URL: ${NEXT_PUBLIC_OSM_TILE_URL:-}
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  dbdata:
