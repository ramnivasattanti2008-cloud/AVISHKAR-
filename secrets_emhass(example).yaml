# AVISHKAR — example secrets template (NOT a real configuration)
#
# This file is a TEMPLATE ONLY. Every value below is a placeholder or a clearly fake value
# (e.g. "thatverylongtokenhere", "yoursecretsolcastapikey"). Nothing here is a live credential.
#
# Copy this file to one of the names the application actually reads (see .gitignore), fill in the
# real values from your secret store, and never commit the copy. The application reads secrets from
# environment variables or a local file that is git-ignored; it does not read this template.
#
# The names come from the Home Assistant / EMHASS conventions this project originally followed.
# Set only the keys you actually use; the rest may stay as placeholders.

# Bind address. 0.0.0.0 means "listen on every interface".
server_ip: 0.0.0.0

# Base URL of your Home Assistant instance, if you integrate with it. Leave as a placeholder otherwise.
hass_url: https://myhass.example.com/

# A long-lived Home Assistant access token, if you integrate with it.
long_lived_token: replace-with-a-real-long-lived-token

# Time zone of the site, as an IANA zone.
time_zone: Europe/Paris

# Location of the site, used to size the PV model.
Latitude: 45.83
Longitude: 6.86
Altitude: 4807.8

# Solcast solar forecast provider, if you use it. Both values are placeholders.
solcast_api_key: yoursecretsolcastapikey
solcast_rooftop_id: yourrooftopid

# Nameplate of the site's PV array, in kWp.
solar_forecast_kwp: 5
